<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#12141A" />
      <stop offset="100%" stopColor="#0A0B0E" />
    </linearGradient>

    <!-- Cyan to Indigo Accent -->
    <linearGradient id="cloudStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#38BDF8" />
      <stop offset="100%" stopColor="#0284C7" />
    </linearGradient>

    <!-- 'R' Gradient -->
    <linearGradient id="rStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="100%" stopColor="#38BDF8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base Container -->
  <rect width="64" height="64" rx="14" fill="#0A0B0E" />
  <rect width="62" height="62" x="1" y="1" rx="13" fill="url(#bgGrad)" stroke="#22262E" stroke-width="1.5" />

  <!-- Cloud Contour with subtle negative space integration -->
  <path
    d="M 18 43 C 12.5 43 9 38.5 9 33.5 C 9 28.5 13 24.8 17.8 24.2 C 19.5 17.5 25.5 13 32.5 13 C 40 13 46 17.8 47.5 24.8 C 51.5 25.8 55 29.5 55 34.5 C 55 40 50.5 43 45 43 Z"
    fill="none"
    stroke="url(#cloudStroke)"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#cyanGlow)"
  />

  <!-- Stylized Modern 'R' in the Center-Left intersecting the cloud's interior -->
  <!-- Stem of R -->
  <line x1="26" y1="22" x2="26" y2="37" stroke="url(#rStroke)" stroke-width="3.5" stroke-linecap="round" />
  
  <!-- Loop of R flowing harmoniously with cloud curves -->
  <path
    d="M 26 22 L 33.5 22 C 37 22 39 24 39 27 C 39 30 37 32 33.5 32 L 26 32"
    fill="none"
    stroke="url(#rStroke)"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Dynamic Leg of R -->
  <line x1="32.5" y1="32" x2="38.5" y2="37" stroke="url(#rStroke)" stroke-width="3.5" stroke-linecap="round" />

  <!-- Cloud Core Tech Indicator Dot -->
  <circle cx="45" cy="34" r="1.5" fill="#38BDF8" />
</svg>
